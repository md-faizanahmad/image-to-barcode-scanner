<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b42318" />
  <meta name="description" content="Upload India Post manifests, extract article numbers, and generate barcodes." />
  <title>Image to Barcode Scanner</title>
</head>

<body>
  <main id="app">
    <header class="app-header">
      <h1>Image to Barcode Scanner</h1>
      <p>Upload an image to extract numbers and generate barcodes.</p>
    </header>

    <section aria-labelledby="upload-heading">
      <h2 id="upload-heading">Upload Image</h2>

      <label for="manifest-file">Choose Image File</label>
      <input id="manifest-file" type="file" accept="image/*" />

      <p id="file-status" role="status">
        No image selected.
      </p>

      <div id="preview-container" hidden>
        <div class="preview-toolbar">
          <span>Image preview</span>
        </div>

        <div class="preview-image-container">
          <img id="manifest-preview" alt="Selected manifest preview" />
        </div>
      </div>

      <button id="clear-button" type="button" disabled>
        Clear image
      </button>
    </section>

    <section id="ocr-section" aria-labelledby="ocr-heading">
      <h2 id="ocr-heading">Extract Image text</h2>

      <button id="extract-text-button" type="button" disabled>
        Extract text
      </button>

      <p id="ocr-status" role="status">
        Upload an image to begin.
      </p>

      <label for="ocr-output">Recognized text</label>
      <textarea id="ocr-output" rows="10" placeholder="Extracted text will appear here..."
        spellcheck="false"></textarea>

      <p id="ocr-confidence"></p>
    </section>

    <section id="article-results" aria-labelledby="article-results-heading">
      <h2 id="article-results-heading">Detected Numbers</h2>
      <p>Extract text to review numbers and generate their barcodes.</p>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
